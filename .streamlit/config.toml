[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F6F8FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172033"
borderColor = "#D9E1EA"
baseRadius = "10px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true
font = "sans-serif"
headingFont = "sans-serif"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["30px", "24px", "19px", "16px", "14px", "12px"]
headingFontWeights = [700, 700, 650, 600, 500, 500]
linkUnderline = false
dataframeHeaderBackgroundColor = "#F1F5F9"
dataframeHeaderTextColor = "#172033"

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F8FB"
textColor = "#172033"
borderColor = "#D9E1EA"
primaryColor = "#2563EB"
