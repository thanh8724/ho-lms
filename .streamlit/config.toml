[theme]
base = "dark"
primaryColor = "#0EA5C9"
backgroundColor = "#060F17"
secondaryBackgroundColor = "#101C28"
textColor = "#F1F5F9"
borderColor = "#263746"
baseRadius = "12px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true
font = "sans-serif"
headingFont = "sans-serif"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["26px", "20px", "16px", "14px", "13px", "12px"]
headingFontWeights = [700, 700, 650, 600, 500, 500]
linkUnderline = false
dataframeHeaderBackgroundColor = "#142331"
dataframeHeaderTextColor = "#F1F5F9"

[theme.sidebar]
backgroundColor = "#080F18"
secondaryBackgroundColor = "#101C28"
textColor = "#F1F5F9"
borderColor = "#263746"
primaryColor = "#0EA5C9"
